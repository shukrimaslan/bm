<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#16a34a"/>
  <!-- Inner circle lighter -->
  <circle cx="256" cy="256" r="220" fill="#15803d"/>
  <!-- Malaysian flag stripe accent -->
  <rect x="0" y="355" width="512" height="50" fill="#dc2626" opacity="0.35" rx="0"/>
  <!-- BM text -->
  <text
    x="256" y="200"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="148"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-4">BM</text>
  <!-- Vocab subtext -->
  <text
    x="256" y="320"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="52"
    fill="rgba(255,255,255,0.85)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="8">VOCAB</text>
  <!-- Star decoration -->
  <text x="256" y="420" font-size="52" text-anchor="middle" dominant-baseline="middle">🇲🇾</text>
</svg>
